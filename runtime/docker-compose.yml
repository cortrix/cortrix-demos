services:
  cortrix:
    image: cortrix-demo:32b82f6
    ports:
      - "127.0.0.1:18420:8420"
      - "127.0.0.1:19091:9091"
    volumes:
      - cortrix-data:/data
      - ../.runtime/config/cortrix.yaml:/app/config/cortrix.yaml:ro
      - ./helpers:/demo-helpers:ro
    environment:
      CORTRIX_DATA_DIR: /data
      CORTRIX_HTTP_PORT: "8420"
      CORTRIX_SERVER_ALLOW_UNAUTHENTICATED_CONTAINER_BIND: "true"
      CORTRIX_PROFILE: quickstart
      CORTRIX_LLM_ENABLED: "${CORTRIX_LLM_ENABLED:-false}"
      CORTRIX_LLM_PROVIDER: "${CORTRIX_LLM_PROVIDER:-disabled}"
      CORTRIX_LLM_API_KEY: "${CORTRIX_LLM_API_KEY:-}"
      CORTRIX_LLM_MODEL: "${CORTRIX_LLM_MODEL:-disabled}"
      CORTRIX_LLM_BASE_URL: "${CORTRIX_LLM_BASE_URL:-}"
      CORTRIX_AGENT_ENABLED: "false"
      CORTRIX_QUICKSTART_BOOTSTRAP_ENABLED: "false"
      CORTRIX_EMBEDDING_EXECUTION_PROVIDER: cpu
      CORTRIX_RERANKER_EXECUTION_PROVIDER: cpu
      CORTRIX_SOURCE_REVISION: 32b82f6f8f1d7a41349f408969ff03b7997b6c15
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8420/api/v1/system/health/ready"]
      interval: 5s
      timeout: 5s
      start_period: 30m
      retries: 3

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/10-demo.sql:ro
    environment:
      POSTGRES_DB: cortrix_demo
      POSTGRES_USER: cortrix_demo
      POSTGRES_PASSWORD: local-demo-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortrix_demo -d cortrix_demo"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  cortrix-data:
  postgres-data:
