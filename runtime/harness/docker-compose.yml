services:
  cortrix:
    image: cortrix:quickstart
    ports:
      - "127.0.0.1:${CORTRIX_HARNESS_HTTP_PORT:-18430}:8420"
    volumes:
      - cortrix-harness-data:/data
    environment:
      CORTRIX_DATA_DIR: /data
      CORTRIX_HTTP_PORT: "8420"
      CORTRIX_SERVER_ALLOW_UNAUTHENTICATED_CONTAINER_BIND: "true"
      CORTRIX_PROFILE: quickstart
      CORTRIX_LLM_ENABLED: "false"
      CORTRIX_AGENT_ENABLED: "false"
      CORTRIX_QUICKSTART_BOOTSTRAP_ENABLED: "false"
      CORTRIX_EMBEDDING_EXECUTION_PROVIDER: cpu
      CORTRIX_RERANKER_EXECUTION_PROVIDER: cpu
      CORTRIX_SOURCE_REVISION: 4c0f0f96b652d5662a66d047771826a4d2933739
    healthcheck:
      test: ["CMD", "/app/healthcheck.sh"]
      interval: 5s
      timeout: 5s
      start_period: 30m
      retries: 3

volumes:
  cortrix-harness-data:
    external: true
    name: ${CORTRIX_HARNESS_VOLUME:-cortrix_demos_harness_foundation_data}
