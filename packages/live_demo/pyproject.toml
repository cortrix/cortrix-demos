[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cortrix-live-demo"
version = "0.1.0"
description = "Implementation candidate for the Cortrix live three-path demo contract"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[project.scripts]
cortrix-live-demo = "cortrix_live_demo.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
